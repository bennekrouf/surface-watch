[package]
name = "surfacewatch-cli"
version.workspace = true
edition = "2021"
license-file = "../../LICENSE"
description = "Headless SurfaceWatch: readiness, capture and diff from the terminal, cron or CI"
default-run = "surfacewatch-cli"

[[bin]]
name = "surfacewatch-cli"
path = "src/main.rs"

[dependencies]
surfacewatch-core = { path = "../core" }
serde_json = "1"
chrono = "0.4"

[lints]
workspace = true
