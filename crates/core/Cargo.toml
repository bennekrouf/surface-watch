[package]
name = "surfacewatch-core"
version.workspace = true
edition = "2021"
license-file = "../../LICENSE"
description = "Shared services (REA runner, surface model, diff engine, store) for SurfaceWatch frontends"

[dependencies]
# The licence rule every mayorana desktop app shares (see src/licence.rs).
desktop-kit = { path = "../../../desktop-kit" }
# desktop-kit's requests: the update check, the notice and the licence (see
# src/kit.rs). The CLI runs them on a runtime of its own (see src/licence.rs).
reqwest = "0.12"
tokio = { version = "1", features = ["rt", "time"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
