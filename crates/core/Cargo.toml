[package]
name = "surface-watch-core"
version.workspace = true
edition = "2021"
license-file = "../../LICENSE"
description = "Shared services (REA runner, surface model, diff engine, store) for Surface Watch frontends"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
