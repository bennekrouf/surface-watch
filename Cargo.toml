[workspace]
members = ["crates/core", "crates/cli"]

# Workspace-wide version: every crate (root + cli + core) inherits via
# `version.workspace = true`, so the window title, CLI `--version` and crate
# manifests stay in sync from this one line.
[workspace.package]
version = "0.1.28"

[package]
name = "surfacewatch"
version.workspace = true
edition = "2021"
license-file = "LICENSE"
description = "Client-side attack surface monitor for web pentest engagements, built on REA captures"

[dependencies]
# Decodes the embedded logo for the window icon (see window_icon in main.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
dioxus = { version = "=0.7.10", features = ["desktop"] }
# What every mayorana desktop app shares: statistics, update check, notice and
# licence. Beside this repository; CI checks it out there at a pinned tag.
desktop-kit = { path = "../desktop-kit", features = ["ui"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
rfd = "0.15"
# The Copy buttons of the MCP setup window.
arboard = { version = "3", default-features = false }
surfacewatch-core = { path = "crates/core" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[workspace.lints.clippy]
# The same lints in every desktop app. A panic is a crash the user sees, so unwrap and expect
# are refused outside tests, as is unsafe code without a SAFETY comment. Where one is right
# (a constant that cannot fail), allow it on that item and say why.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
