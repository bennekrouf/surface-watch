name: CI

# Fast feedback on every branch and PR.
#
# release.yml is the heavy pipeline: it only runs on `v*` tags and produces
# signed macOS/Windows/Linux builds. This workflow gives fast feedback first.
on:
  pull_request:

# A newer push on the same ref cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting: blocking ───────────────────────────────────────────────────
  # No toolchain deps and no compile, so this reports in ~20s. The tree is
  # rustfmt-clean and .githooks/pre-commit keeps it that way, so this is a real
  # gate rather than a check that is red forever and learned to be ignored.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  # ── Tests: blocking ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy

      # Keys off Cargo.lock *and* prunes the target dir between runs, which
      # plain actions/cache does not — worth it for a workflow this frequent.
      - uses: Swatinem/rust-cache@v2

      # Dioxus desktop links GTK/WebKit even when all you are doing is running
      # unit tests.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config

      # Cargo.lock is committed (this is an application), so CI builds what
      # was tested locally.
      - name: Test
        run: cargo test --workspace --locked

      # Dioxus expands rsx! differently in release builds: a component key
      # that reads a prop moved into the same component compiles in debug
      # and fails in release. Catch that here, not at tag time.
      - name: Release-mode check
        run: cargo check --workspace --release --locked

      # Last, so the target dir is warm from the test build. The tree starts
      # clippy-clean, so warnings fail the job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
