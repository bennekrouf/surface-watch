<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Surface Watch: a sweep over a page outline. Rounded square per macOS
       icon grid (824px tile, 100px margin). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5fd8"/>
      <stop offset="1" stop-color="#1b3a96"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <!-- page outline -->
  <rect x="262" y="250" width="500" height="524" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="28"/>
  <line x1="262" y1="340" x2="762" y2="340" stroke="#ffffff" stroke-opacity="0.9" stroke-width="28"/>
  <!-- radar sweep -->
  <path d="M512 560 L512 400 A160 160 0 0 1 664 510 Z" fill="url(#sweep)"/>
  <circle cx="512" cy="560" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="16"/>
  <circle cx="512" cy="560" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="16"/>
  <!-- the change it spotted -->
  <circle cx="612" cy="478" r="30" fill="#ffc94d"/>
  <circle cx="512" cy="560" r="16" fill="#ffffff"/>
</svg>
